spring.application.name=smart-grid-management

# Server Configuration
server.port=8080

# Database Configuration (XAMPP MySQL on port 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/smart_grid?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration (64-byte secret key for HS256)
jwt.secret=9a4f2c8d3b7a1e5f8g0h2i4j6k8l0m2n4o6p8q0r2s4t6u8v0w2x4y6z8a0b2c4d
jwt.expiration=86400000

# File Upload / API limits if needed
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
